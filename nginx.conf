server {
    listen 80;
    listen 443 ssl;
    server_name tascade.fjtco.com;

    # Path to the built Vite dist folder
    root /var/www/tascade/dist;
    index index.html;

    # ─── SPA fallback ───────────────────────────────────────────────────────────
    # This is the critical directive. Without it, navigating directly to any
    # client-side route (e.g. /reset-password?token=...) returns a 404 and
    # React Router never loads, causing the wildcard route to redirect to /login.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── Static assets — cache aggressively ─────────────────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ─── API proxy (adjust upstream address as needed) ──────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
